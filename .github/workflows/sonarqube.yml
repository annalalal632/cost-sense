name: SonarQube Scan Test

on:
  workflow_dispatch:

  schedule:
    - cron: "30 15 * * 5"   # Every Friday

  push:
    tags:
      - "v*"

env:
  SONAR_PROJECT_KEY: cost-sense-ipredict
  SONAR_HOST_URL: http://98.70.40.192:9025

jobs:
  sonarqube-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            -Dsonar.sources=.
            -Dsonar.exclusions=**/sonarqube.py

      - name: Debug Sonar Task
        run: cat .scannerwork/report-task.txt

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          pip install requests pandas jinja2

      - name: Run Sonar Report Script
        run: python sonarqube.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ env.SONAR_PROJECT_KEY }}

      - name: Upload Sonar Reports
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: sonarqube_output/**/*

      - name: Generate Artifact Link
        id: artifact
        run: |
          echo "link=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "SonarQube Scan Report"
          to: annalalal632@gmail.com
          from: GitHub Actions
          body: |
            SonarQube Scan Completed.

            Repository: ${{ github.repository }}
            Branch/Tag: ${{ github.ref_name }}

            Download Artifact:
            ${{ steps.artifact.outputs.link }}
