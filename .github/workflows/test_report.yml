name: Publish Cost Sense Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name for the release"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release and Upload File
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: cost-sense-release-${{ github.event.inputs.tag }}
          files: test_document.xlsx
        env:
          GITHUB_TOKEN: ${{ secrets.COSTSENSE_TOKEN }}
